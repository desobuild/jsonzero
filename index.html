    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

    <!-- Icons & PWA Metadata -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"

  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="
          max-width: 720px;
          margin: 2rem auto;
          padding: 1.5rem;
          font-family:
            ui-sans-serif,
            system-ui,
            -apple-system,
            sans-serif;
          color: #e2e8f0;
          background: #0f172a;
          border-radius: 8px;
        "
      >
        <h1 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 0.5rem">
          JSONZero
        </h1>
        <p style="font-size: 1.1rem; color: #94a3b8; margin-bottom: 1rem">
          <strong>Privacy-first JSON developer workbench.</strong>
        </p>
        <p style="margin-bottom: 0.75rem">
          Format, validate, compare, inspect, transform and convert JSON
          directly in your browser.
        </p>
        <p style="color: #38bdf8; margin-bottom: 1.5rem">
          Your JSON stays in your browser. No accounts. No ads. No tracking.
        </p>
        <h2 style="font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem">
          Core Capabilities
        </h2>
        <ul style="line-height: 1.6; padding-left: 1.25rem">
          <li>
            <strong>JSON Formatter:</strong> Fast local formatting, indentation
            control, and compact minification.
          </li>
          <li>
            <strong>JSON Validator:</strong> Instant syntax validation with
            precise line and column error diagnosis.
          </li>
          <li>
            <strong>JSON Diff:</strong> Side-by-side structural comparison
            highlighting modified, added, and removed nodes.
          </li>
          <li>
            <strong>JSON Inspection:</strong> Hierarchical tree exploration with
            type badges and JSONPath queries.
          </li>
          <li>
            <strong>JSON Transformation:</strong> Sort keys recursively,
            flatten, unflatten, escape, and unescape JSON.
          </li>
          <li>
            <strong>JSON Conversion:</strong> Convert JSON to CSV, Interactive
            Table, TypeScript interfaces, Dart models, and JSON Schema.
          </li>
          <li>
            <strong>Developer & Testing Tools:</strong> Schema validation, API
            assertions, Playwright test assertions, and mock JSON generation.
          </li>
        </ul>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
